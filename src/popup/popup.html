<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Disney+ Tela Cheia</title>
    <link rel="stylesheet" href="./popup.css" />
    <script src="./popup.js" defer></script>
  </head>
  <body>
    <main class="panel">
      <section class="hero">
        <div class="hero-brand">
          <img
            class="hero-logo"
            src="../assets/icons/icon-128.png"
            alt="Logo da extensao Disney+ Tela Cheia"
          />
          <p class="eyebrow">DisneyPlus.com</p>
        </div>
        <h1>Tela cheia automatica</h1>
        <p class="subtitle">
          Deixe o video da Disney+ tentar voltar sozinho para a tela cheia ao trocar de episodio.
        </p>
      </section>

      <section class="status-card">
        <p class="status-label">Status atual</p>
        <p class="status-value" id="statusText">Carregando configuracoes...</p>
      </section>

      <section class="toggle-list">
        <label class="toggle-row">
          <span class="toggle-copy">
            <strong>Automacao geral</strong>
            <small>Liga ou desliga todas as automacoes da extensao.</small>
          </span>
          <input type="checkbox" data-setting-key="enabled" />
        </label>

        <label class="toggle-row">
          <span class="toggle-copy">
            <strong>Tela cheia ao trocar episodio</strong>
            <small>Tenta voltar para a tela cheia quando o player muda de episodio.</small>
          </span>
          <input type="checkbox" data-setting-key="autoFullscreenOnEpisodeChange" />
        </label>

        <label class="toggle-row">
          <span class="toggle-copy">
            <strong>Repetir tentativa</strong>
            <small>Faz novas tentativas enquanto o proximo episodio carrega.</small>
          </span>
          <input type="checkbox" data-setting-key="retryFullscreenWhilePlayerLoads" />
        </label>

        <label class="toggle-row">
          <span class="toggle-copy">
            <strong>Modo de verificacao</strong>
            <small>Use so se quiser checar melhor o funcionamento.</small>
          </span>
          <input type="checkbox" data-setting-key="debugLogs" />
        </label>
      </section>

      <footer class="footer-note">
        Tudo pronto para usar. Se quiser investigar algo, ligue o modo de verificacao.
      </footer>
    </main>
  </body>
</html>
