<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Disney+ Tela Cheia</title>
    <link rel="stylesheet" href="./popup.css" />
    <script src="./popup.js" defer></script>
  </head>
  <body>
    <main class="panel">
      <section class="hero">
        <div class="hero-brand">
          <img
            class="hero-logo"
            src="../assets/icons/icon-128.png"
            alt="Logo da extensão Disney+ Tela Cheia"
          />
          <p class="eyebrow">DisneyPlus.com</p>
        </div>
        <h1>Disney+ AutoScreen</h1>
      </section>

      <section class="status-card">
        <p class="status-label">Status</p>
        <p class="status-value" id="statusText">Carregando configurações...</p>
      </section>

      <section class="toggle-list">
        <label class="toggle-row">
          <span class="toggle-copy"><strong>Automação</strong></span>
          <input type="checkbox" data-setting-key="enabled" />
        </label>

        <label class="toggle-row">
          <span class="toggle-copy"><strong>Tela cheia</strong></span>
          <input type="checkbox" data-setting-key="autoFullscreenOnEpisodeChange" />
        </label>

        <label class="toggle-row">
          <span class="toggle-copy"><strong>Pular introdução</strong></span>
          <input type="checkbox" data-setting-key="autoSkipIntro" />
        </label>

        <label class="toggle-row">
          <span class="toggle-copy"><strong>Pular encerramento</strong></span>
          <input type="checkbox" data-setting-key="autoPlayNextEpisode" />
        </label>

        <label class="toggle-row">
          <span class="toggle-copy"><strong>Repetir tentativa</strong></span>
          <input type="checkbox" data-setting-key="retryFullscreenWhilePlayerLoads" />
        </label>

        <label class="toggle-row">
          <span class="toggle-copy"><strong>Verificação</strong></span>
          <input type="checkbox" data-setting-key="debugLogs" />
        </label>
      </section>
      <footer class="meta-pills" aria-label="Contatos">
        <a
          class="meta-pill"
          href="https://github.com/turkosx"
          target="_blank"
          rel="noreferrer"
        >
          GitHub: turkosx
        </a>
        <span class="meta-pill">Discord: @tur.ko</span>
      </footer>
    </main>
  </body>
</html>
